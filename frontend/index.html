<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sparrow</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="stage">
    <section class="device" id="device" aria-live="polite">
      <div class="sim-banner" id="simBanner" hidden>SIMULATION · NOT REAL BUSES</div>

      <header class="topbar">
        <span class="brand">SPARROW</span>
        <span class="mode" id="modeLabel">—</span>
        <span class="clock" id="clock"></span>
        <span class="badge" id="badge">…</span>
      </header>

      <div class="hero" id="hero">
        <canvas class="scene" id="scene" width="120" height="26" aria-hidden="true"></canvas>
        <div class="route" id="route">&nbsp;</div>
        <div class="action" id="action">LOADING</div>
        <div class="reason" id="reason">&nbsp;</div>
        <div class="alt" id="alt" hidden></div>
      </div>

      <div class="rows" id="rows"></div>

      <footer class="foot">
        <span id="updated">&nbsp;</span>
        <span id="conn"></span>
      </footer>
    </section>

    <div class="controls">
      <a class="hw observe" href="/observe">Log a bus arrival</a>
      <div class="buttons">
        <button type="button" id="modeBtn" class="hw">Switch mode</button>
        <button type="button" id="viewBtn" class="hw" aria-pressed="false">Show schedule</button>
        <button type="button" id="refreshBtn" class="hw">Refresh</button>
      </div>
      <p class="legend">
        <b>12m</b> live · <i>≈12m</i> scheduled/estimated (not live) ·
        <b>12m!</b> tight (cuts into the buffer) · <s>12m</s> can't make it
      </p>
      <details class="dev">
        <summary>Dev</summary>
        <label class="sim">
          Simulation
          <select id="simSelect">
            <option value="">Off (real SEPTA data)</option>
          </select>
        </label>
        <label class="sim">
          Season
          <select id="seasonSelect">
            <option value="">Auto (from the date)</option>
            <option value="winter">Winter</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="fall">Fall</option>
          </select>
        </label>
        <label class="sim"><input type="checkbox" id="netSim"> Simulate lost connection</label>
      </details>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
