; Sparrow firmware. See firmware/README.md.
;   pio test -e native        board-independent core tests (runs on any computer)
;   pio run -e m5sticks3      build for the M5Stack StickS3
;   pio run -e m5sticks3 -t upload

[platformio]
default_envs = m5sticks3

[env]
lib_deps =
  bblanchon/ArduinoJson@7.4.3

[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  ${env.lib_deps}
  m5stack/M5Unified@0.3.0
monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -Isrc
build_src_filter = +<core/>
test_build_src = yes
