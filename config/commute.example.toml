# Example Sparrow commute profile (safe to commit: generic downtown stops).
# Copy to config/commute.local.toml (gitignored) and put the real stops there.
# Verify stop IDs with: python scripts/find_stops.py --route 40 --direction 1 --name "Lombard"

[settings]
timezone = "America/New_York"
safety_buffer_min = 2.0          # extra margin on top of walking time
preference_threshold_min = 5.0   # take the preferred route if it boards within this many minutes of the alternative
get_ready_window_min = 3.0       # show GET READY when the leave time is this close
tight_max_wait_min = 10.0        # recommend a TIGHT bus only if the next safe bus is more than this much later
stale_after_s = 120              # live data older than this is shown as STALE
discard_after_s = 600            # live data older than this is not used at all
arrivals_per_route = 3
work_after = "03:00"              # auto mode: show the work commute from this time (local)...
home_after = "14:00"              # ...until this time, then the home commute

[modes.work]
label = "To Work"
preferred_route = "40"

[[modes.work.options]]
route = "40"
direction_id = 1                 # Westbound
stop_id = "22265"
stop_name = "Lombard St & 10th St"
walk_min = 4.0

[[modes.work.options]]
route = "42"
direction_id = 1                 # Westbound
stop_id = "14884"
stop_name = "Walnut St & 10th St"
walk_min = 7.0

[modes.home]
label = "To Home"
preferred_route = "40"
# No options yet: the return commute isn't configured, so the app shows a setup message.
