# Fly.io deployment for Sparrow. Not deployed yet: see docs/deployment.md.
# Set `app` to the name you create with `fly apps create`.
app = "sparrow-CHANGE-ME"
primary_region = "iad"  # Ashburn, VA: closest Fly region to Philadelphia

[build]

[env]
  SPARROW_DB = "/data/sparrow.sqlite"
  SPARROW_COLLECT = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Must stay running: a sleeping server can't collect predictions, and a cold start
  # is the last thing you want while trying to catch a bus.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "sparrow_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
